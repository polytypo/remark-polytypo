name: Release (npm publish)

# Runs on a `v*` tag. `verify` builds, tests and packs exactly one tarball and checks that file;
# `publish` downloads it, re-checks its checksum and publishes that exact file. Authentication is
# npm trusted publishing (OIDC): there is no npm token anywhere, and `id-token: write` exists only
# in the publish job. A trusted publisher (owner polytypo, repository remark-polytypo, workflow
# release.yml) must be configured on the package on npmjs.com.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release gate and pack the artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball-filename: ${{ steps.pack.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Verify the tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.mjs "${RELEASE_TAG}"

      - name: Verify the tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::the tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:workflow-shell-safety
      - run: pnpm check:actions-pinned
      - run: pnpm test
      - run: pnpm build

      - name: Pack the release tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          pnpm pack --pack-destination release-artifact
          TARBALL_COUNT=$(find release-artifact -maxdepth 1 -name '*.tgz' | wc -l)
          if [ "${TARBALL_COUNT}" -ne 1 ]; then
            echo "::error::expected exactly one .tgz in release-artifact/, found ${TARBALL_COUNT}"
            exit 1
          fi
          FILENAME=$(basename "$(ls release-artifact/*.tgz)")
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "path=release-artifact/${FILENAME}" >> "$GITHUB_OUTPUT"
          ( cd release-artifact && sha256sum "${FILENAME}" > SHA256SUMS )
          cat release-artifact/SHA256SUMS

      - name: Packed-tarball smoke test
        env:
          TARBALL_PATH: ${{ steps.pack.outputs.path }}
        run: node scripts/packed-tarball.mjs --tarball "${TARBALL_PATH}"

      - name: Upload verified tarball as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-tarball
          path: |
            release-artifact/*.tgz
            release-artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the verified tarball to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance; nothing else needs it
    steps:
      - name: Download the verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-tarball
          path: release-artifact

      - name: Confirm the expected tarball is present, and only it
        env:
          EXPECTED_FILENAME: ${{ needs.verify.outputs.tarball-filename }}
        run: |
          set -euo pipefail
          if [ ! -f "release-artifact/${EXPECTED_FILENAME}" ]; then
            echo "::error::expected release-artifact/${EXPECTED_FILENAME} but it is not present"
            exit 1
          fi
          TARBALL_COUNT=$(find release-artifact -maxdepth 1 -name '*.tgz' | wc -l)
          if [ "${TARBALL_COUNT}" -ne 1 ]; then
            echo "::error::expected exactly one .tgz in release-artifact/, found ${TARBALL_COUNT}"
            exit 1
          fi

      - name: Verify tarball checksum matches what was verified
        run: |
          cd release-artifact
          sha256sum -c SHA256SUMS

      # Trusted publishing needs npm CLI 11.5.1 or newer. Node 24.22.1 bundles npm 11.19.1, so no
      # npm is installed in this job, where the OIDC token is available.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          registry-url: "https://registry.npmjs.org"

      - name: Check the bundled npm is new enough
        run: npm --version && node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1))))process.exit(1)' "$(npm --version)"

      - name: Publish to npm with provenance
        env:
          TARBALL_FILENAME: ${{ needs.verify.outputs.tarball-filename }}
        run: |
          set -euo pipefail
          # The "./" prefix keeps npm from reading the path as a GitHub "owner/repo" shorthand.
          npm publish "./release-artifact/${TARBALL_FILENAME}" --provenance --access public
